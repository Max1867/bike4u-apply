<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike 4 U — Your Contract</title>
<style>body{font-family:-apple-system,sans-serif;background:#54C08A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}p{font-size:18px}</style>
</head>
<body>
<p>Opening your contract…</p>
<script>
  // Short contract link: /c/?t=<token> -> apply-web streams the signed PDF.
  var t = new URLSearchParams(location.search).get("t") || "";
  t = t.replace(/[^A-Za-z0-9]/g, "");
  if (t) {
    location.replace("https://jpzhifjccuxcetdodeue.supabase.co/functions/v1/apply-web?doc=" + t);
  } else {
    document.querySelector("p").textContent = "Invalid link — please contact Bike 4 U.";
  }
</script>
</body>
</html>
